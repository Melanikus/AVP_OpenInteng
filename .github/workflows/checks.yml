# The first gates of AVP_OpenInteng (Tao 1: security is paramount; a failing check blocks the merge for everyone, admins included).
#
# Four jobs, for every pull request into main and every push to it:
#   - No precompiled code: no library, DLL, executable or object file is committed. The libraries the editor uses are built from
#     pinned sources, and this keeps it that way.
#   - No scanner told to look away: nothing in the repository switches off or silences a scanner (the same rule as AvPx).
#   - The AvPx pin: avpx/ is pinned to a commit on AvPx's avpx_main, every check that ran on that commit passed (the required ones
#     included, by name), and a pin only moves forward unless the pull request says it's a revert. tools/check-pin.sh says how.
#   - inteng's menus: src/host/inteng_menus.cpp is exactly what tools/make-inteng-menus.js makes of docs/inteng's two files (the menus
#     file checked as hostile input first), and every refusal of the tool has its test (tools/make-inteng-menus-test.js). (Added
#     2026-11-15, A6.)
#   - The one compiler: every project imports AvPx's msvc-pin.props in its place, and every Windows job installs that MSVC before it builds
#     (tools/check-msvc-pin.js, its refusals tested by tools/check-msvc-pin-test.js). alpha.3 shipped what a newer runner compiler made, never
#     what had been scanned. (Added 2026-11-22 by Melanikus (Frost), Bishop's order.)
#     The AvPx pin job also runs the test of the release's gate on the pin's library scan (tools/sca-gate-test.ps1). (Added 2026-11-22
#     by Melanikus (Vasquez), Bishop 2's order.)
# A check that can't run (GitHub's API down, say) fails, and nothing merges. TAKING-OVER.md says what to do if a tool is gone.
# The build, tests, take-out rows, Snyk, same-flags and coding-standard gates come with the editor's first code (the phase 2 plan, F1-F2).
# Written 2026-11-14 by Melanikus for AVP_OpenInteng.
name: Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Read only. No job here can change the repository.
permissions:
  contents: read

# One run at a time for each pull request: a newer head cancels the run it replaces. A push to main, or a run started by hand, has a group of its
# own (its commit), so it is never queued behind another or cancelled: GitHub cancels a waiting run in a shared group even when
# cancel-in-progress is false.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  no-precompiled:
    name: No precompiled code, no scanner told to look away
    runs-on: ubuntu-24.04   # pinned, so a runner-image migration never changes the gate
    steps:
      # The same pin AvPx uses
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fail if precompiled code is committed
        run: |
          # git lists the submodule as one entry (a commit, not files), so this looks only at this repository's own files.
          found=$(git ls-files | grep -i -E '\.(lib|dll|exe|obj|o|a|so|dylib|pdb|ilk|exp|pyd|pyc|class|jar|msi)$' || true)
          if [ -n "$found" ]; then
            echo "$found"
            echo "::error::Precompiled code is committed. Build it from pinned sources instead."
            exit 1
          fi
          echo "No precompiled code found."

      - name: Fail if anything tells a scanner to look away
        run: |
          # The same words AvPx's gate refuses (its snyk.yml), outside the workflows that name them.
          found=$(git grep -n -i -E 'deepcode ignore|snyk:ignore|lgtm\[|codeql\[|NOSONAR|nolint' -- . ':!.github' || true)
          files=$(git ls-files | grep -E '(^|/)\.(snyk|dcignore)$' || true)
          if [ -n "$found$files" ]; then
            echo "$found"
            echo "$files"
            echo "::error::Something in the repository suppresses a scanner"
            exit 1
          fi
          echo "No scanner suppressions found."

      # Snyk Code's C++ parser skips a WHOLE file it can't read, and the scan then passes on what it did read. Two declarations it can't
      # read (found 2026-11-17, when it skipped 13 files): a template's nested type with const after it ("std::vector<int>::iterator const
      # found") and an east-const pointer inside a std::function's signature ("std::function<bool(uint8_t const *id)>"). Written
      # const-first they mean the same and Snyk reads them, so this says which line, at once, before the scan's coverage check would.
      - name: Fail on a declaration Snyk Code can't parse
        run: |
          # the first in any C++ file; the second only in headers, where Snyk failed on it (in .cpp files it reads it)
          found=$( (git grep -n -E '>::[A-Za-z_]+ const [A-Za-z_]' -- '*.cpp' '*.h' ':!avpx'; git grep -n -E 'std::function<[^>]*[A-Za-z0-9_] const \*' -- '*.h' ':!avpx') || true)
          if [ -n "$found" ]; then
            echo "$found"
            echo "::error::Snyk Code skips a file with these declarations: write them const-first (const T name), which means the same"
            exit 1
          fi
          # A third, found 2026-11-17 (bisected: tests/host_placed_light_type_test.cpp skipped whole): a for loop whose variable is named
          # "in" ("for (size_t in = ...;"), which the parser seems to take for an Objective-C "for (x in list)". Rename the variable.
          forin=$(git grep -n -E 'for[[:space:]]*\([^;]*[^A-Za-z0-9_]in[[:space:]]*(=|;|:|\{|\()' -- '*.cpp' '*.h' ':!avpx' || true)
          if [ -n "$forin" ]; then
            echo "$forin"
            echo "::error::Snyk Code skips a file with a for loop whose variable is named 'in': rename the variable"
            exit 1
          fi
          # A fourth, found 2026-11-18 (bisected by commit and by variant: src/host/poly_edit.cpp skipped whole from 490a70a2, PR #80): a lambda's
          # trailing return type written east-const with a pointer ("-> model::UvList const *"). Const-first ("-> const model::UvList *") means the same.
          trailing=$(git grep -n -E -e '->[[:space:]]*[A-Za-z_][A-Za-z0-9_:<>]*[[:space:]]+const[[:space:]]*\*' -- '*.cpp' '*.h' ':!avpx' || true)
          if [ -n "$trailing" ]; then
            echo "$trailing"
            echo "::error::Snyk Code skips a file with a return type written '-> T const *': write it const-first, '-> const T *'"
            exit 1
          fi
          echo "No declaration Snyk Code can't parse."

      # Snyk Code also skips, without saying so, a file over about 1 MiB: src/host/editor_main.cpp was left out at 1,057,726 bytes (read at
      # 1,027,933), found 2026-11-17, twice. This fails at 900 KB, before Snyk would skip the file, and names it, so it's split in time.
      - name: Fail on a source file too big for Snyk Code to read
        run: |
          found=$(git ls-files -- '*.cpp' '*.c' '*.h' '*.hpp' ':!avpx' | while IFS= read -r f; do s=$(stat -c %s "$f"); if [ "$s" -gt 921600 ]; then echo "$f: $s bytes"; fi; done)
          if [ -n "$found" ]; then
            echo "$found"
            echo "::error::Snyk Code skips a source file over about 1 MiB without saying so: split it (this check stops at 900 KB, to leave room)"
            exit 1
          fi
          echo "Every source file is under 900 KB."

  avpx-pin:
    name: The AvPx pin
    runs-on: ubuntu-24.04   # pinned, as above
    steps:
      - name: Check out the repository (the submodule itself isn't fetched, only its pinned commit id is read)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the pin
        env:
          GH_TOKEN: ${{ github.token }}
          # The base branch and the pull request's title come in as plain text in the environment, never pasted into the script,
          # so a title can't become a command.
          BASE_REF: ${{ github.base_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: bash tools/check-pin.sh

      # The release's gate on AvPx's library scan of this pin (tools/sca-gate.ps1, release.yml's jobs sca and publish): its own test, on every
      # pull request, so a gate that went wrong is caught here and not on release day. It asks GitHub nothing and has no token in reach.
      - name: The release's gate on the pin's library scan refuses every run that does not prove it
        shell: pwsh
        run: ./tools/sca-gate-test.ps1

  inteng-menus:
    name: inteng's menus are what their two files make
    runs-on: ubuntu-24.04   # pinned, as above
    steps:
      - name: Check out the repository (the submodule isn't needed)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The runner's own Node.js: the tool and its test use only its built-in fs, path and crypto, and install nothing
      - name: The generated menus match their two files, and every refusal of the tool is tested
        run: |
          node tools/make-inteng-menus.js --check
          node tools/make-inteng-menus-test.js

  msvc-pin:
    name: Every program is built with the one compiler
    runs-on: ubuntu-24.04   # pinned, as above
    steps:
      - name: Check out the repository (the submodule isn't needed; the check reads the projects and the workflows)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The runner's own Node.js: the check and its test use only its built-in fs, path, os and child_process, and install nothing
      - name: Every project imports avpx/win32/msvc-pin.props in its place, every Windows job installs it before it builds, and every refusal is tested
        run: |
          node tools/check-msvc-pin.js
          node tools/check-msvc-pin-test.js
