# Makes a release of the editor, only when the owner asks for it ("Run workflow", on main, with a version number such as 1.0.0, or an
# alpha or beta of one such as 1.0.0-alpha.0, which makes a pre-release). Written 2026-11-17 by Melanikus for AVP_OpenInteng, after AvPx's
# own release.yml, whose steps and reasons it keeps.
#
# It never publishes anything. It ends with a draft release that only people with write access can see, and the owner reads that and
# presses Publish. Until then there's no tag either: GitHub makes the tag when the draft is published.
#
# Why it's started by hand, and not by pushing a tag: a workflow comes from the commit it runs on, so a tag could point at a commit with
# these checks taken out. Started from main, this file comes from main, where changing it has to get past the same checks as anything else.
#
# The zip holds the editor, mp4-to-smk.exe (a user's own video made into an AvP message video), the runtime files they need beside them,
# and their licences. Those runtime files (OpenAL Soft and fmt, Microsoft's D3DX and its shader compiler, Microsoft's C++ runtime) come
# from AvPx's own package, built here by AvPx's own script at the commit avpx/ is pinned to, so each one comes with the licence text, and
# OpenAL Soft with the source, that AvPx's package gives it (a source only with its own library).
# Barry Duncan's two Smacker libraries are LINKED INTO the programs, not shipped beside them (the owner's order 11-21, "STATIC LINK,
# SEPARATE BARRY'S LIBS", after alpha.3's VirusTotal finding): libsmackerdec into AVP_OpenInteng.exe (its FMV preview), libsmackerenc into
# mp4-to-smk.exe. Each is a static library of its own, built from avpx's pinned source with its own settings (win32/VS2026/
# libsmackerdec_static.vcxproj, libsmackerenc_static.vcxproj), so the zip has no libsmacker*.dll and no program loads one; the package step
# refuses a package where one is there or a program names one. As the GNU LGPL 2.1 asks of a library linked in, each one's licence and its
# whole source (as avpx pins it) go in the zip with the program that holds it, and licences/README.txt says where the program's own source
# is, to build it again with your own build of the library. The leave_out_encoder input (off unless the owner asks) makes the same package
# without the video encoder, as alpha.2 shipped: no mp4-to-smk.exe, and so no libsmackerenc and no source of it. Only mp4-to-smk uses the
# encoder (the editor has no video import); the FMV preview's decoder stays, in the editor.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "The version: three numbers such as 1.0.0, or an alpha or beta of one such as 1.0.0-alpha.0, which makes a pre-release"
        required: true
        type: string
      leave_out_encoder:
        description: "Leave the video encoder out of the zip: mp4-to-smk.exe, and with it libsmackerenc's licence and source (the FMV preview's decoder stays, in the editor). Off unless the owner asks."
        required: false
        type: boolean
        default: false

# Nothing by default: each job says what it needs, and only the last one can write anything.
permissions: {}

# One at a time, so that two runs can't be checking the same version at once.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    name: Check this commit may be released
    runs-on: ubuntu-24.04   # pinned, so a runner-image migration never changes the gate
    timeout-minutes: 10
    permissions:
      contents: read   # to read the code, and which tags there are
      checks: read     # to read the checks of this commit
    outputs:
      tag: ${{ steps.refuse.outputs.tag }}
      prerelease: ${{ steps.refuse.outputs.prerelease }}
    steps:
      # The version comes in through a setting and is never written into the command, because a person types it.
      - name: Refuse anything that may not be released
        id: refuse
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:GITHUB_REF -cne 'refs/heads/main') { throw 'A release is made only from main' }
          $isPre = $env:VERSION -cmatch '^(0|[1-9][0-9]{0,5})\.(0|[1-9][0-9]{0,5})\.(0|[1-9][0-9]{0,5})-(alpha|beta)\.(0|[1-9][0-9]{0,3})\z'
          if (-not $isPre -and $env:VERSION -cnotmatch '^(0|[1-9][0-9]{0,5})\.(0|[1-9][0-9]{0,5})\.(0|[1-9][0-9]{0,5})\z') { throw 'The version is not three numbers, or an alpha or beta of them' }

          $tip = gh api "repos/$env:GITHUB_REPOSITORY/commits/main" --jq .sha
          if ($LASTEXITCODE -ne 0) { throw 'Could not read the tip of main' }
          if ($tip -cne $env:GITHUB_SHA) { throw "main has moved on to $tip, so this commit is no longer its tip" }

          # Every check a pull request into main runs has to have passed on this very commit, by name, each once at least, and none failed.
          $required = 'Build the editor', 'Unit tests (1 of 4)', 'Unit tests (2 of 4)', 'Unit tests (3 of 4)', 'Unit tests (4 of 4)', 'Snyk Code (SAST)', 'No precompiled code, no scanner told to look away', 'The AvPx pin', "inteng's menus are what their two files make"
          $runs = gh api "repos/$env:GITHUB_REPOSITORY/commits/$env:GITHUB_SHA/check-runs?per_page=100" --jq '.check_runs[] | [.name, .status, .conclusion] | @tsv'
          if ($LASTEXITCODE -ne 0) { throw 'Could not read the checks of this commit' }
          $runs = @($runs | Where-Object { $_ })
          foreach ($name in $required) {
            $mine = @($runs | Where-Object { ($_ -split "`t")[0] -ceq $name })
            if ($mine.Count -eq 0) { throw "The check '$name' never ran on this commit" }
            foreach ($run in $mine) {
              $null, $status, $conclusion = $run -split "`t"
              if ($status -cne 'completed' -or $conclusion -cne 'success') { throw "The check '$name' is $status, $conclusion on this commit" }
            }
          }

          $tag = "v$env:VERSION"
          $tags = gh api "repos/$env:GITHUB_REPOSITORY/tags?per_page=100" --jq '.[].name'
          if ($LASTEXITCODE -ne 0) { throw 'Could not read the tags' }
          if (@($tags) -ccontains $tag) { throw "$tag is already a tag" }
          $noMark = New-Object System.Text.UTF8Encoding $false
          [System.IO.File]::AppendAllText($env:GITHUB_OUTPUT, "tag=$tag`nprerelease=$(if ($isPre) { 'true' } else { 'false' })`n", $noMark)
          "$tag may be released: every check passed on $env:GITHUB_SHA"

  build:
    name: Build the package
    needs: check
    runs-on: windows-2025-vs2026   # pinned: Windows Server 2025 with Visual Studio 2026, the compiler we build with
    timeout-minutes: 120           # the libraries are built from source, so this takes a while
    permissions:
      contents: read
    steps:
      - name: Check out the repository and AvPx at its pinned commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true

      # What main's own CI (build.yml, on a push to main) kept of vcpkg's builds and downloads, only read here, never written. GitHub
      # gives a run on main only main's caches, never a pull request's. vcpkg takes a kept build only when its hash (port, version,
      # triplet, compiler, dependencies) is exactly what it would build, and checks each source archive's SHA-512 before using it;
      # anything else it builds from source.
      - name: Take main's kept vcpkg builds and downloads
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}\vcpkg-archives
            ${{ runner.temp }}\vcpkg-downloads
          key: vcpkg-x86-windows-vs2026-${{ hashFiles('avpx/vcpkg.json', 'avpx/vcpkg-configuration.json', 'avpx/vcpkg-overlay-ports/**', 'avpx/vcpkg-overlay-triplets/**') }}
          restore-keys: vcpkg-x86-windows-vs2026-

      # AvPx's own script, as AvPx's every pull request runs it: the libraries by vcpkg at its baseline, the game, and its package, with
      # each library's licence and OpenAL Soft's source (from the downloads above, or downloaded again). The editor takes its runtime
      # files and their licences from that package.
      - name: Build AvPx's libraries and package with AvPx's own script
        shell: pwsh
        working-directory: avpx
        env:
          VCPKG_BINARY_SOURCES: clear;files,${{ runner.temp }}\vcpkg-archives,read
          VCPKG_DOWNLOADS: ${{ runner.temp }}\vcpkg-downloads
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\vcpkg-archives", $env:VCPKG_DOWNLOADS | Out-Null
          ./tools/build-and-package.ps1 -OutFolder "$env:RUNNER_TEMP\avpx-package"

      # Each project builds its Smacker library first, by its project reference (the decoder for the editor, the encoder for mp4-to-smk),
      # and links it in: no DLL is pinned, shipped or loaded. EncoderBuiltIn=true is mp4-to-smk's default, written out here so a release
      # can never be the retired DLL build.
      - name: Build the editor and mp4-to-smk
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $msbuild = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1
          if (-not $msbuild) { throw 'MSBuild was not found' }
          & $msbuild win32\VS2026\AVP_OpenInteng.vcxproj /nologo /v:minimal /m /nodeReuse:false /p:Configuration=Release /p:Platform=Win32 `
            /p:ImportDirectoryBuildProps=false /p:ImportDirectoryBuildTargets=false /p:VcpkgManifestInstall=false /p:VcpkgApplocalDeps=false `
            "/p:VcpkgInstalledDir=$env:GITHUB_WORKSPACE/avpx/vcpkg_installed/" /p:VcpkgTriplet=x86-windows
          if ($LASTEXITCODE -ne 0) { throw "The editor didn't build (MSBuild exit $LASTEXITCODE)" }
          if (-not (Test-Path -LiteralPath 'win32\VS2026\Win32\Release\AVP_OpenInteng.exe')) { throw 'MSBuild gave back 0 but made no AVP_OpenInteng.exe' }
          & $msbuild win32\VS2026\mp4-to-smk.vcxproj /nologo /v:minimal /m /nodeReuse:false /p:Configuration=Release /p:Platform=Win32 `
            /p:ImportDirectoryBuildProps=false /p:ImportDirectoryBuildTargets=false /p:EncoderBuiltIn=true
          if ($LASTEXITCODE -ne 0) { throw "mp4-to-smk didn't build (MSBuild exit $LASTEXITCODE)" }
          if (-not (Test-Path -LiteralPath 'win32\VS2026\Win32\Release\mp4-to-smk.exe')) { throw 'MSBuild gave back 0 but made no mp4-to-smk.exe' }

      # The package: the editor, and every file of AvPx's bin it asks for (and what those ask for in turn), read from the programs' own
      # import lists by dumpbin. A file that isn't in AvPx's bin is Windows' own. Then the licences of exactly those files, with AvPx's
      # words for each; the licence and whole source of each Smacker library linked into a program here; and the editor's own License.txt,
      # notices and README.
      - name: Make the package
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
          # The input comes in through a setting, never written into the script: GitHub gives a boolean input as the text true or false.
          LEAVE_OUT_ENCODER: ${{ inputs.leave_out_encoder }}
        run: |
          $from = "$env:RUNNER_TEMP\avpx-package"
          $package = "$env:RUNNER_TEMP\package"
          New-Item -ItemType Directory -Force $package | Out-Null
          Copy-Item 'win32\VS2026\Win32\Release\AVP_OpenInteng.exe' $package
          # Each Smacker library linked into a program in this package, with the program that holds it: its licence and source go with it (below)
          $linked = [ordered]@{ 'libsmackerdec' = 'AVP_OpenInteng.exe' }
          if ($env:LEAVE_OUT_ENCODER -ceq 'true') { 'The video encoder (mp4-to-smk.exe, and with it libsmackerenc''s licence and source) is left out of this package, as the run was asked (leave_out_encoder)' }
          elseif ($env:LEAVE_OUT_ENCODER -ceq 'false') { Copy-Item 'win32\VS2026\Win32\Release\mp4-to-smk.exe' $package; $linked['libsmackerenc'] = 'mp4-to-smk.exe' }
          else { throw "leave_out_encoder is neither true nor false: $env:LEAVE_OUT_ENCODER" }

          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $visualStudio = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          # THE ONE COMPILER's dumpbin (avpx/win32/msvc-pin.props), never the newest this machine has
          . ./avpx/tools/msvc-pin-version.ps1
          $msvcPin = Get-MsvcPinVersion (Join-Path $PWD 'avpx')
          $dumpbin = Get-Item -LiteralPath (Join-Path (Get-MsvcPinFolder $visualStudio $msvcPin) 'bin\Hostx64\x86\dumpbin.exe') -ErrorAction SilentlyContinue
          if (-not $dumpbin) { throw "dumpbin was not found in MSVC $msvcPin" }
          $avpxBin = @{}
          Get-ChildItem -LiteralPath "$from\bin" -File -Filter '*.dll' | ForEach-Object { $avpxBin[$_.Name.ToLowerInvariant()] = $_.FullName }
          do {
            $copied = 0
            foreach ($binary in @(Get-ChildItem -LiteralPath $package -File | Where-Object { $_.Extension -in '.exe', '.dll' })) {
              $output = & $dumpbin.FullName /nologo /dependents $binary.FullName
              if ($LASTEXITCODE -ne 0) { throw "dumpbin could not read $($binary.Name)" }
              foreach ($name in @($output | Where-Object { $_ -match '^\s+\S+\.dll\s*$' } | ForEach-Object { $_.Trim().ToLowerInvariant() })) {
                if (-not $avpxBin.ContainsKey($name) -or (Test-Path -LiteralPath (Join-Path $package $name))) { continue }
                Copy-Item -LiteralPath $avpxBin[$name] -Destination (Join-Path $package $name)
                "$name, because $($binary.Name) needs it"
                $copied++
              }
            }
          } while ($copied -gt 0)
          # D3DX loads its shader compiler by name while the editor runs, so no import list names it
          if (-not (Test-Path -LiteralPath (Join-Path $package 'd3dx9_43.dll'))) { throw 'The editor no longer asks for d3dx9_43.dll: check the package by hand' }
          if (-not $avpxBin.ContainsKey('d3dcompiler_43.dll')) { throw "AvPx's package has no D3DCompiler_43.dll" }
          Copy-Item -LiteralPath $avpxBin['d3dcompiler_43.dll'] -Destination (Join-Path $package 'D3DCompiler_43.dll')
          # Barry's Smacker libraries are linked into the programs (win32/VS2026/libsmacker*_static.vcxproj), so none of their DLLs may be here and no
          # program may name one: an import would have brought the DLL in above, from AvPx's bin, and its name in a program's bytes is a DLL the program
          # would load while it runs (the retired DLL way: dll_load's LoadLibraryExW took L"libsmackerdec.dll"). Either fails the package, with its reason.
          $latin1 = [System.Text.Encoding]::GetEncoding(28591)
          foreach ($dll in 'libsmackerdec.dll', 'libsmackerenc.dll') {
            if (Test-Path -LiteralPath (Join-Path $package $dll)) { throw "$dll is in the package (a program imports it), but the programs link Barry's libraries in" }
            $wide = -join @($dll.ToCharArray() | ForEach-Object { "$_" + [char]0 })
            foreach ($program in @(Get-ChildItem -LiteralPath $package -File -Filter '*.exe')) {
              $bytes = $latin1.GetString([System.IO.File]::ReadAllBytes($program.FullName))
              if ($bytes.IndexOf($dll, [System.StringComparison]::OrdinalIgnoreCase) -ge 0 -or $bytes.IndexOf($wide, [System.StringComparison]::OrdinalIgnoreCase) -ge 0) {
                throw "$($program.Name) names $dll, so it would load it while it runs, but the programs link Barry's libraries in"
              }
            }
          }

          # AvPx's words for each of those files, from its licences/README.txt ("bin/<name>: ..."), and every licence file those words name.
          # Its links to source point at AvPx's repository, which holds that source.
          $about = @(Get-Content -LiteralPath "$from\licences\README.txt")
          $licenceFolder = Join-Path $package 'licences'
          New-Item -ItemType Directory -Force $licenceFolder | Out-Null
          $lines = @()
          foreach ($binary in @(Get-ChildItem -LiteralPath $package -File -Filter '*.dll' | Sort-Object Name)) {
            $line = @($about | Where-Object { $_.ToLowerInvariant().StartsWith("bin/$($binary.Name.ToLowerInvariant()):") })
            if ($line.Count -ne 1) { throw "AvPx's licences/README.txt doesn't have one line for $($binary.Name)" }
            $text = $line[0].Substring($line[0].IndexOf(':') + 1).Trim() -replace [regex]::Escape("github.com/$env:GITHUB_REPOSITORY/"), 'github.com/Melanikus/AvP/'
            $lines += "$($binary.Name): $text"
            foreach ($named in @([regex]::Matches($text, 'licences/([A-Za-z0-9._-]+\.txt)') | ForEach-Object { $_.Groups[1].Value })) {
              if (-not (Test-Path -LiteralPath "$from\licences\$named")) { throw "AvPx's package has no licences/$named" }
              Copy-Item -LiteralPath "$from\licences\$named" -Destination $licenceFolder -Force
            }
          }
          # The sources AvPx's package holds go with their own library, and only with it: OpenAL Soft's with openal32.dll, its folder of
          # licences/sources copied only when the library is in this package (11-19: a folder copied whenever OpenAL was there sent another
          # library's source out without it). A library that is here and whose source is not is refused, with its own words.
          $sourceOf = [ordered]@{ 'openal32.dll' = @('openal-soft', '*.tar.gz') }
          foreach ($dll in $sourceOf.Keys) {
            if (-not (Test-Path -LiteralPath (Join-Path $package $dll))) { continue }
            $folder, $mark = $sourceOf[$dll]
            if (Test-Path -LiteralPath "$from\licences\sources\$folder") {
              New-Item -ItemType Directory -Force (Join-Path $licenceFolder 'sources') | Out-Null
              Copy-Item -Recurse -LiteralPath "$from\licences\sources\$folder" -Destination (Join-Path $licenceFolder "sources\$folder")
            }
            if (-not (Get-ChildItem -LiteralPath (Join-Path $licenceFolder "sources\$folder") -Filter $mark -File -ErrorAction SilentlyContinue)) {
              throw "$dll ships without its source (AvPx's licences/sources/$folder, its $mark)"
            }
          }
          # Each Smacker library linked into a program here, as the GNU LGPL 2.1 asks of a library linked in: its licence (its own COPYING, which must
          # say it is that licence, as licences/<name>.txt) and its whole source as avpx pins it, every file git has under avpx/dependencies/<name>,
          # named one by one so nothing a build left beside them goes too, in licences/sources/<name>; with the editor's project that built it
          # (win32/VS2026/<name>_static.vcxproj), and a line saying where the program's own source is, to build it again with your own build of it.
          $avpxCommit = git -C avpx rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or "$avpxCommit" -cnotmatch '^[0-9a-f]{40}$') { throw 'avpx is not a checkout with a commit' }
          $whatLinked = @{
            'libsmackerdec' = "Barry Duncan's player for Smacker films, the editor's FMV preview"
            'libsmackerenc' = "a Smacker film encoder made from Barry Duncan's libsmackerdec for Open Inteng, the level editor"
          }
          foreach ($library in $linked.Keys) {
            $program = $linked[$library]
            $files = @(git -C avpx ls-files "dependencies/$library")
            if ($LASTEXITCODE -ne 0 -or -not ($files -ccontains "dependencies/$library/COPYING")) { throw "avpx has no source of $library with its COPYING (git ls-files dependencies/$library)" }
            $licence = @(Get-Content -LiteralPath "avpx\dependencies\$library\COPYING" -TotalCount 3 | ForEach-Object { $_.Trim() })
            if (-not ($licence -ccontains 'GNU LESSER GENERAL PUBLIC LICENSE') -or -not ($licence -ccontains 'Version 2.1, February 1999')) { throw "$library's COPYING is not the GNU LGPL 2.1 this package says it is" }
            $to = Join-Path $licenceFolder "sources\$library"
            foreach ($file in $files) {
              $dest = Join-Path $to $file.Substring("dependencies/$library/".Length)
              New-Item -ItemType Directory -Force (Split-Path -Parent $dest) | Out-Null
              Copy-Item -LiteralPath (Join-Path 'avpx' $file) -Destination $dest
            }
            Copy-Item -LiteralPath "win32\VS2026\$($library)_static.vcxproj" -Destination $to
            Copy-Item -LiteralPath "avpx\dependencies\$library\COPYING" -Destination (Join-Path $licenceFolder "$library.txt") -Force
            $lines += "$($library): $($whatLinked[$library]), linked into $program (licences/$library.txt, the GNU Lesser General Public License, version 2.1). " +
              "Its whole source is here with it, in licences/sources/$library, as AvPx pins it (https://github.com/Melanikus/AvP/tree/$avpxCommit/dependencies/$library), " +
              "with $($library)_static.vcxproj, the project that built it. To use your own build of it, build $program again from this release's source " +
              "(https://github.com/$env:GITHUB_REPOSITORY/tree/$env:GITHUB_SHA) with yours in its place."
          }
          # and no source of a library that isn't here: a Smacker library's goes only with the program it is linked into, any other only with its DLL
          foreach ($folder in @(Get-ChildItem -LiteralPath (Join-Path $licenceFolder 'sources') -Directory -ErrorAction SilentlyContinue | ForEach-Object { $_.Name })) {
            if ($linked.Contains($folder)) { if (-not (Test-Path -LiteralPath (Join-Path $package $linked[$folder]))) { throw "licences/sources/$folder ships without $($linked[$folder])" }; continue }
            $owner = @($sourceOf.Keys | Where-Object { $sourceOf[$_][0] -eq $folder })
            if ($owner.Count -ne 1 -or -not (Test-Path -LiteralPath (Join-Path $package $owner[0]))) { throw "licences/sources/$folder ships without its library" }
          }
          $readme = @(
            "The runtime files the editor needs beside it, and each one's licence, as AvPx's own package gives them, and the libraries linked into"
            'the programs. Each line names a file or a library, says what it is and which licences go with it, and, for the ones under the GNU'
            'licences, where their source is.'
            ''
          ) + $lines
          [System.IO.File]::WriteAllLines((Join-Path $licenceFolder 'README.txt'), [string[]]$readme)

          Copy-Item License.txt, README.md $package
          # Without the encoder (leave_out_encoder), the README this package ships says so where it tells you about mp4-to-smk, so it never
          # promises a program the zip hasn't got (Dietrich's review of #94). The heading must be there exactly once, or the step fails: a
          # README changed without this would ship the old promise.
          if ($env:LEAVE_OUT_ENCODER -ceq 'true')
          {
            $readmeFile = Join-Path $package 'README.md'
            $lines = @(Get-Content -LiteralPath $readmeFile)
            $at = @(for ($i = 0; $i -lt $lines.Count; $i++) { if ($lines[$i] -ceq '## Your own videos (mp4-to-smk)') { $i } })
            if ($at.Count -ne 1) { throw "README.md has $($at.Count) headings '## Your own videos (mp4-to-smk)', and the note about the left-out encoder goes under one" }
            $note = @('', '**Not in this package:** this release leaves the video encoder out, so the zip has no mp4-to-smk.exe (and so no libsmackerenc),',
              'and what follows about it doesn''t apply to it. The editor still plays the videos a level has (its decoder, libsmackerdec, is linked into it).')
            $lines = @($lines[0..$at[0]]) + $note + @($lines[($at[0] + 1)..($lines.Count - 1)])
            [System.IO.File]::WriteAllLines($readmeFile, [string[]]$lines)
            'README.md says the encoder is left out of this package.'
          }
          # The editor's own settings file, as the owner wants it shipped (11-18): its window starts framed, 1280 x 720 (StartWidth, StartHeight, Windowed: src/host/editor_options.h).
          # It names no DataFolder: each mapper adds his own, and the editor says so at its start until he has. tests/host_editor_options_test reads it.
          if (-not (Test-Path -LiteralPath 'dist\AVP_OpenInteng.ini')) { throw 'dist\AVP_OpenInteng.ini, the settings file the zip ships, is not there' }
          Copy-Item -LiteralPath 'dist\AVP_OpenInteng.ini' -Destination $package
          Copy-Item -Recurse notices (Join-Path $package 'notices')
          "AVP_OpenInteng $env:VERSION, commit $env:GITHUB_SHA, AvPx $(git -C avpx rev-parse HEAD)" | Out-File -Encoding ascii (Join-Path $package 'BUILD.txt')

          Push-Location $package
          # Each file's name inside the package: its full path with the package's own folder cut off the front (a file that isn't inside it stops
          # the step), and / between folders
          $hashes = Get-ChildItem -Recurse -File | ForEach-Object {
            if (-not $_.FullName.StartsWith("$package\", [System.StringComparison]::OrdinalIgnoreCase)) { throw "$($_.FullName) is not inside $package" }
            '{0}  {1}' -f (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLower(), ($_.FullName.Substring($package.Length + 1) -replace '\\', '/')
          }
          Pop-Location
          # LF line ends and no byte-order mark, so sha256sum -c reads it on Linux and WSL too (Out-File wrote CRLF: the CR stuck to every name)
          $sumsFile = Join-Path $package 'SHA256SUMS.txt'
          [System.IO.File]::WriteAllText($sumsFile, (($hashes -join "`n") + "`n"), [System.Text.UTF8Encoding]::new($false))
          $bytes = [System.IO.File]::ReadAllBytes($sumsFile)
          if ($bytes -contains 13 -or ($bytes.Length -ge 3 -and $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF)) { throw 'SHA256SUMS.txt must be LF with no byte-order mark' }
          Get-Content $sumsFile

      - name: Zip the package, and work out its hash
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
        run: |
          $folder = "$env:RUNNER_TEMP\release"
          New-Item -ItemType Directory -Force $folder | Out-Null
          $name = "AVP_OpenInteng-$env:VERSION-windows-x86.zip"
          Compress-Archive -Path "$env:RUNNER_TEMP\package\*" -DestinationPath (Join-Path $folder $name)
          $hash = (Get-FileHash -Algorithm SHA256 (Join-Path $folder $name)).Hash.ToLower()
          # LF and no byte-order mark (as SHA256SUMS.txt above): sha256sum -c on Linux and WSL reads it; the jobs below read it with Get-Content, which takes LF too
          $sumsFile = Join-Path $folder 'SHA256SUMS'
          [System.IO.File]::WriteAllText($sumsFile, "$hash  $name`n", [System.Text.UTF8Encoding]::new($false))
          $bytes = [System.IO.File]::ReadAllBytes($sumsFile)
          if ($bytes -contains 13 -or $bytes[0] -eq 0xEF) { throw 'SHA256SUMS must be LF with no byte-order mark' }
          Get-Content $sumsFile

      - name: Keep the package for the next jobs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-package
          path: ${{ runner.temp }}/release
          retention-days: 1
          if-no-files-found: error

  # VirusTotal runs about 70 virus scanners on a file. The zip, and every file inside it on its own (2026-11-21: a scanner flagged
  # libsmackerenc.dll only when it was sent alone; and Dietrich's review: not only the programs), are each analysed in this run: sent if VirusTotal doesn't know the file, and analysed
  # again if it does, so no verdict older than the run counts. What comes back is from outside our code, so AvPx's tools/check-virustotal.ps1 (at the pinned commit) reads every
  # answer before anything here believes it (Tao 3). The owner's ruling, 2026-11-08: if any scanner flags it, the draft is still made, its
  # text starts by saying so, and the run ends red. The key is in the release environment, and only this job reads it; it can write nothing.
  scan:
    name: Scan the package on VirusTotal
    needs: build
    runs-on: ubuntu-24.04   # pinned, so a runner-image migration never changes the gate
    timeout-minutes: 180    # about 50 files, at most 3 questions a minute: about 35 minutes to send them all, then the wait for their analyses
    environment: release    # where the VirusTotal key is kept
    permissions:
      contents: read
    outputs:
      sha256: ${{ steps.ask.outputs.sha256 }}
      malicious: ${{ steps.ask.outputs.malicious }}
      suspicious: ${{ steps.ask.outputs.suspicious }}
      answered: ${{ steps.ask.outputs.answered }}
      files: ${{ steps.ask.outputs.files }}
      files_flagged: ${{ steps.ask.outputs.files_flagged }}
    steps:
      - name: Check out the repository and AvPx at its pinned commit (for its VirusTotal checker)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true

      - name: Get the package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-package
          path: release

      # The key reaches only this step, and is taken out of its environment before anything starts. This step starts one program only,
      # the checker, and the key is only ever sent in the x-apikey header to www.virustotal.com. A redirect isn't followed.
      - name: Ask VirusTotal about the package, and every file in it
        id: ask
        shell: pwsh
        env:
          VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
          VERSION: ${{ inputs.version }}
        run: |
          $key = $env:VIRUSTOTAL_API_KEY
          if (-not $key) { throw 'The VIRUSTOTAL_API_KEY secret is missing from the release environment' }
          Remove-Item Env:VIRUSTOTAL_API_KEY
          $headers = @{ 'x-apikey' = $key }

          $isPre = $env:VERSION -cmatch '^(0|[1-9][0-9]{0,5})\.(0|[1-9][0-9]{0,5})\.(0|[1-9][0-9]{0,5})-(alpha|beta)\.(0|[1-9][0-9]{0,3})\z'
          if (-not $isPre -and $env:VERSION -cnotmatch '^(0|[1-9][0-9]{0,5})\.(0|[1-9][0-9]{0,5})\.(0|[1-9][0-9]{0,5})\z') { throw 'The version is not one this workflow makes' }
          $sums = @(Get-Content release/SHA256SUMS)
          if ($sums.Count -ne 1) { throw 'SHA256SUMS should have one line, for the zip' }
          $sha, $name = $sums[0] -split '  ', 2
          if ($sha -cnotmatch '^[0-9a-f]{64}\z') { throw 'The hash in SHA256SUMS is not a SHA-256' }
          if ($name -cne "AVP_OpenInteng-$env:VERSION-windows-x86.zip") { throw 'SHA256SUMS names a file that is not the zip this version makes' }
          $zip = "release/$name"
          $answers = Join-Path $env:RUNNER_TEMP 'virustotal'
          New-Item -ItemType Directory -Force $answers | Out-Null
          $giveUp = (Get-Date).AddMinutes(170)

          function Ask-Checker([string]$fileSha, [string[]]$arguments)
          {
            $said = @(& pwsh -NoProfile -File ./avpx/tools/check-virustotal.ps1 -Sha256 $fileSha @arguments)
            $code = $LASTEXITCODE
            $said | ForEach-Object { Write-Host $_ }
            if ($code -ne 0) { exit 1 }
            $answer = @($said | Where-Object { $_.StartsWith('ANSWER: ') })
            if ($answer.Count -ne 1) { throw 'The VirusTotal checker gave no answer' }
            return $answer[0].Substring('ANSWER: '.Length)
          }

          $script:lastAsked = [datetime]::MinValue
          function Ask-VirusTotal([string]$method, [string]$path, [string]$saveAs, $form)
          {
            while ($true)
            {
              if ((Get-Date) -gt $giveUp) { throw 'VirusTotal had not answered in time' }
              $wait = 20 - ((Get-Date) - $script:lastAsked).TotalSeconds
              if ($wait -gt 0) { Start-Sleep -Seconds ([math]::Ceiling($wait)) }
              $script:lastAsked = Get-Date
              $asking = @{ Uri = "https://www.virustotal.com/api/v3/$path"; Method = $method; Headers = $headers; OutFile = $saveAs; TimeoutSec = 300; MaximumRedirection = 0; SkipHttpErrorCheck = $true; StatusCodeVariable = 'answeredWith' }
              if ($form) { $asking.Form = $form }
              Invoke-RestMethod @asking
              if ($answeredWith -ne 429) { return $answeredWith }
              Write-Host 'VirusTotal says the key has asked too often. Waiting a minute.'
              Start-Sleep -Seconds 60
            }
          }

          # Every verdict that counts is from this run (Dietrich's review of #94, 2026-11-21). A file VirusTotal already knows is analysed
          # again, with today's scanners (POST files/<sha>/analyse), and a file it doesn't know is sent. An old analysis is never counted: once
          # builds repeat byte for byte, the same file comes back every release, and a clean verdict from long ago would pass for ever.
          # Every file is sent first, then every analysis is waited for: they run at VirusTotal side by side, so the wait is for the slowest,
          # not for each in turn. Each answer is saved under the file's own hash and read by the checker first, and the same bytes twice in
          # the package are analysed once.
          function Send-One([string]$path, [string]$fileSha, [string]$what)
          {
            if ((Ask-Checker $fileSha @('-Package', $path)) -cne 'ready') { throw "$what is not ready to send" }
            # Only whether VirusTotal knows the file is taken from this answer, never what it said about it before
            $status = Ask-VirusTotal 'Get' "files/$fileSha" "$answers/$fileSha-lookup.json"
            if ($status -eq 200) { $status = Ask-VirusTotal 'Post' "files/$fileSha/analyse" "$answers/$fileSha-sent.json"; $how = 'analysed again' }
            elseif ($status -eq 404) { $status = Ask-VirusTotal 'Post' 'files' "$answers/$fileSha-sent.json" @{ file = Get-Item -LiteralPath $path }; $how = 'sent for the first time' }
            else { throw "VirusTotal answered the question about $what with HTTP $status" }
            if ($status -ne 200) { throw "VirusTotal answered the request to analyse $what with HTTP $status" }
            $answer = Ask-Checker $fileSha @('-Answer', "$answers/$fileSha-sent.json", '-Kind', 'upload')
            if ($answer -cnotmatch '^analysis [A-Za-z0-9+/=]{1,200}\z') { throw "VirusTotal started no analysis of $what" }
            Write-Host "$($what): $how"
            return $answer.Substring('analysis '.Length)
          }

          # Waits for every analysis started, asking about each in turn, and gives back each file's counts by its hash: how many scanners
          # called it malicious, how many suspicious, and how many answered
          function Wait-All($started)
          {
            $done = @{}
            while ($done.Count -lt $started.Count)
            {
              foreach ($fileSha in @($started.Keys))
              {
                if ($done.ContainsKey($fileSha)) { continue }
                $id = $started[$fileSha]
                $status = Ask-VirusTotal 'Get' "analyses/$([uri]::EscapeDataString($id))" "$answers/$fileSha-analysis.json"
                if ($status -ne 200) { throw "VirusTotal answered the question about an analysis with HTTP $status" }
                $answer = Ask-Checker $fileSha @('-Answer', "$answers/$fileSha-analysis.json", '-Kind', 'analysis', '-AnalysisId', $id)
                if ($answer -ceq 'waiting') { continue }
                if ($answer -cmatch '^counted (0|[1-9][0-9]{0,3}) (0|[1-9][0-9]{0,3}) ([1-9][0-9]{0,3})\z') { $done[$fileSha] = @([int]$Matches[1], [int]$Matches[2], [int]$Matches[3]) }
                else { throw 'The VirusTotal checker gave no count' }
              }
            }
            return $done
          }

          # The zip, then every file inside it, each on its own: a scanner can flag a file sent alone that it passed inside the zip, and a
          # file that isn't a program (an archive, a source, a text) is sent too. -Force takes the files whose names start with a dot, which
          # the Linux runner would leave out. A package with no program in it isn't the one the build makes. A name is printed only as
          # letters, digits and . _ - /
          $started = [ordered]@{}
          $started[$sha] = Send-One $zip $sha 'the zip'
          $inside = Join-Path $env:RUNNER_TEMP 'package-files'
          Expand-Archive -LiteralPath $zip -DestinationPath $inside
          $files = @(Get-ChildItem -LiteralPath $inside -Recurse -File -Force | Sort-Object FullName)
          if (@($files | Where-Object { $_.Extension -ieq '.exe' }).Count -eq 0) { throw 'The zip has no .exe in it, so it is not the package the build makes' }
          $sent = @()
          foreach ($file in $files)
          {
            $shown = ($file.FullName.Substring($inside.Length + 1) -replace '\\', '/') -replace '[^A-Za-z0-9._/-]', '_'
            $fileSha = (Get-FileHash -Algorithm SHA256 -LiteralPath $file.FullName).Hash.ToLowerInvariant()
            $sent += ,@($shown, $fileSha)
            if (-not $started.Contains($fileSha)) { $started[$fileSha] = Send-One $file.FullName $fileSha $shown }
          }
          "Analyses started: $($started.Count) (the zip, and $($started.Count - 1) different files of the $($files.Count) in it). Waiting for them all."
          $counted = Wait-All $started

          $noMark = New-Object System.Text.UTF8Encoding $false
          $counts = $counted[$sha]
          [System.IO.File]::AppendAllText($env:GITHUB_OUTPUT, "sha256=$sha`nmalicious=$($counts[0])`nsuspicious=$($counts[1])`nanswered=$($counts[2])`n", $noMark)
          "the zip: $($counts[0]) malicious, $($counts[1]) suspicious, of $($counts[2]) scanners (sha256 $sha)"
          $flaggedFiles = 0
          foreach ($s in $sent)
          {
            $c = $counted[$s[1]]
            "$($s[0]): $($c[0]) malicious, $($c[1]) suspicious, of $($c[2]) scanners (sha256 $($s[1]))"
            if ($c[0] + $c[1] -gt 0) { $flaggedFiles++ }
          }
          [System.IO.File]::AppendAllText($env:GITHUB_OUTPUT, "files=$($files.Count)`nfiles_flagged=$flaggedFiles`n", $noMark)

          # The owner, 2026-11-21: a release ships only at zero findings, on the zip and on every file in it. One file flagged stops the run
          # here, before anything is attested or drafted.
          if ($flaggedFiles -gt 0) { throw "VirusTotal flagged $flaggedFiles of the $($files.Count) files in the package, so no draft is made: a release ships only at zero findings" }
          "VirusTotal: none of the $($files.Count) files in the package was flagged"

  publish:
    name: Make the draft release
    needs: [check, build, scan]
    runs-on: ubuntu-24.04   # pinned, so a runner-image migration never changes the gate
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write       # to make the draft. The only job here that can write to the repository
      id-token: write       # to prove to the attestation service which workflow this is
      attestations: write   # to record how the package was built
    # This job runs no code from the repository, and doesn't have a copy of it.
    steps:
      - name: Get the package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-package
          path: release

      - name: Refuse if anything has changed since the checks
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
          TAG: ${{ needs.check.outputs.tag }}
          PRERELEASE: ${{ needs.check.outputs.prerelease }}
          SCAN_SHA256: ${{ needs.scan.outputs.sha256 }}
          SCAN_MALICIOUS: ${{ needs.scan.outputs.malicious }}
          SCAN_SUSPICIOUS: ${{ needs.scan.outputs.suspicious }}
          SCAN_ANSWERED: ${{ needs.scan.outputs.answered }}
          SCAN_FILES: ${{ needs.scan.outputs.files }}
          SCAN_FILES_FLAGGED: ${{ needs.scan.outputs.files_flagged }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $tip = gh api "repos/$env:GITHUB_REPOSITORY/commits/main" --jq .sha
          if ($LASTEXITCODE -ne 0) { throw 'Could not read the tip of main' }
          if ($tip -cne $env:GITHUB_SHA) { throw "main has moved on to $tip since this was checked" }
          $isPre = $env:VERSION -cmatch '^(0|[1-9][0-9]{0,5})\.(0|[1-9][0-9]{0,5})\.(0|[1-9][0-9]{0,5})-(alpha|beta)\.(0|[1-9][0-9]{0,3})\z'
          if (-not $isPre -and $env:VERSION -cnotmatch '^(0|[1-9][0-9]{0,5})\.(0|[1-9][0-9]{0,5})\.(0|[1-9][0-9]{0,5})\z') { throw 'The version is not one this workflow makes' }
          if ($env:TAG -cne "v$env:VERSION") { throw 'The tag from the checks is not the one this version makes' }
          if ($env:PRERELEASE -cne $(if ($isPre) { 'true' } else { 'false' })) { throw 'Whether this is a pre-release does not match the version' }
          $releases = gh release list --repo $env:GITHUB_REPOSITORY --limit 1000 --json tagName --jq '.[].tagName'
          if ($LASTEXITCODE -ne 0) { throw 'Could not read the list of releases' }
          if (@($releases) -ccontains $env:TAG) { throw "There is already a release of $env:TAG, maybe a draft" }
          $sums = @(Get-Content release/SHA256SUMS)
          if ($sums.Count -ne 1) { throw 'SHA256SUMS should have one line, for the zip' }
          $wanted, $name = $sums[0] -split '  ', 2
          if ($wanted -cnotmatch '^[0-9a-f]{64}\z') { throw 'The hash in SHA256SUMS is not a SHA-256' }
          if ($name -cne "AVP_OpenInteng-$env:VERSION-windows-x86.zip") { throw 'SHA256SUMS names a file that is not the zip this version makes' }
          if ((Get-FileHash -Algorithm SHA256 "release/$name").Hash.ToLower() -cne $wanted) { throw 'The package is not what the build made' }
          if ($env:SCAN_SHA256 -cne $wanted) { throw 'The scan on VirusTotal was of a different zip' }
          if ($env:SCAN_MALICIOUS -cnotmatch '^(0|[1-9][0-9]{0,3})\z' -or $env:SCAN_SUSPICIOUS -cnotmatch '^(0|[1-9][0-9]{0,3})\z') { throw 'A count from the scan is not a whole number' }
          if ($env:SCAN_ANSWERED -cnotmatch '^[1-9][0-9]{0,3}\z' -or [int]$env:SCAN_ANSWERED -lt 20) { throw 'The scan did not count enough scanners' }
          if ($env:SCAN_FILES -cnotmatch '^[1-9][0-9]{0,3}\z' -or $env:SCAN_FILES_FLAGGED -cnotmatch '^(0|[1-9][0-9]{0,3})\z') { throw 'The scan did not count the files in the package' }
          if ([int]$env:SCAN_FILES_FLAGGED -gt 0) { throw "VirusTotal flagged $env:SCAN_FILES_FLAGGED of the package's files: no draft is made" }
          # The owner, 2026-11-21: "We block on ANYTHING", "Doesn't matter if it's some shitty provider with 1990s heuristics". A release
          # is made only at ZERO findings: one engine, of any size or age, that calls the zip malicious or suspicious stops the run here,
          # before the build is attested and before any draft exists, so a flagged zip is never one click from public. (alpha.3 was
          # published at 1 of 62 from a draft this workflow still made, and had to be withdrawn.) Leave the flagged part out
          # (leave_out_encoder) or fix it, and run again.
          if ([int]$env:SCAN_MALICIOUS + [int]$env:SCAN_SUSPICIOUS -gt 0) {
            throw "VirusTotal: $env:SCAN_MALICIOUS malicious and $env:SCAN_SUSPICIOUS suspicious of $env:SCAN_ANSWERED engines on this zip, so no draft is made: a release ships only at zero findings. https://www.virustotal.com/gui/file/$wanted"
          }

      - name: Record how the package was built
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: release/SHA256SUMS

      - name: Make the draft
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
          TAG: ${{ needs.check.outputs.tag }}
          PRERELEASE: ${{ needs.check.outputs.prerelease }}
          SCAN_MALICIOUS: ${{ needs.scan.outputs.malicious }}
          SCAN_SUSPICIOUS: ${{ needs.scan.outputs.suspicious }}
          SCAN_ANSWERED: ${{ needs.scan.outputs.answered }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:TAG
          $preRelease = $env:PRERELEASE -ceq 'true'
          $sums = @(Get-Content release/SHA256SUMS)
          if ($sums.Count -ne 1) { throw 'SHA256SUMS should have one line, for the zip' }
          $hash, $name = $sums[0] -split '  ', 2
          if ($hash -cnotmatch '^[0-9a-f]{64}\z') { throw 'The hash in SHA256SUMS is not a SHA-256' }
          if ($name -cne "AVP_OpenInteng-$env:VERSION-windows-x86.zip") { throw 'SHA256SUMS names a file that is not the zip this version makes' }

          $report = "https://www.virustotal.com/gui/file/$hash"
          # The step above already refused any finding; this says it again where the draft is made, so no later edit can lose it.
          if ([int]$env:SCAN_MALICIOUS + [int]$env:SCAN_SUSPICIOUS -gt 0) { throw 'A zip VirusTotal flagged reached the draft step: no draft is made' }
          $scanned = "VirusTotal: none of $env:SCAN_ANSWERED engines flagged this zip: $report"
          @(@(
            "Built from commit $env:GITHUB_SHA by run $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID.",
            '',
            "SHA-256 of ${name}: $hash",
            '',
            $scanned,
            '',
            "To check that this file is what that run built: gh attestation verify $name --repo $env:GITHUB_REPOSITORY",
            '',
            'The owner writes what changed here before publishing.'
          )) | Out-File -Encoding utf8 notes.md

          $alsoSay = @()
          if ($preRelease) { $alsoSay += '--prerelease' }
          gh release create $tag "release/$name" release/SHA256SUMS --repo $env:GITHUB_REPOSITORY --draft --target $env:GITHUB_SHA --title "AVP_OpenInteng $tag" --notes-file notes.md @alsoSay
          if ($LASTEXITCODE -ne 0) { throw 'The draft could not be made' }
          $made = gh release view $tag --repo $env:GITHUB_REPOSITORY --json isDraft,isPrerelease,targetCommitish | ConvertFrom-Json
          if (-not $made.isDraft) { throw 'The release is not a draft' }
          if ($made.isPrerelease -ne $preRelease) { throw "The draft's pre-release mark is $($made.isPrerelease), and it should be $preRelease" }
          if ($made.targetCommitish -cne $env:GITHUB_SHA) { throw "The draft points at $($made.targetCommitish), not at the commit that was checked" }
          "The draft of $tag is ready for the owner to read and publish."
