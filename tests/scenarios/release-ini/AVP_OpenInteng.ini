; AVP_OpenInteng's settings, read at its start (the README on the project's page, https://github.com/Melanikus/AVP_OpenInteng, says what each
; one is, under "Its settings"). The release zip puts this file beside AVP_OpenInteng.exe.
; In the game's Tools folder (<the game>\Tools, as inteng was) the editor reads the game's files from the folder above it, the one that holds
; avp_rifs, with nothing to set. Anywhere else, add a line DataFolder=<that folder> under [Editor]: a DataFolder= line always wins.
; A level is opened by giving it to the editor: double-click a .rif file once Windows opens them with it (the README says how).
;
; StartWidth / StartHeight: the size the editor's window starts at (its inside), at least 640 x 480 and at most your monitor.
; Windowed: true keeps the window framed, as the command line's -w does; false lets a size as big as the monitor cover it whole, as classic inteng.
; An IntengOptions.ini of classic inteng's, beside the editor or in its Tools folder (IntengTools=), still wins for the size, as in inteng.
; AutoPlot: 1 shows Waypoint's Alien auto waypoint menu, which plots the alien waypoints for you; 0 hides it.
[Editor]
StartWidth=1280
StartHeight=720
Windowed=true
AutoPlot=1
